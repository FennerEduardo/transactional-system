version: '3.8'

services:
  # Host Environment SDK Isolation Sandbox
  app:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: transactional-system-app
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - DATABASE_URL=${DATABASE_URL:-postgresql://dev_user:dev_password@postgresql:5432/transactional-system_db}
      - AMQP_URL=${AMQP_URL:-amqp://dev_user:dev_password@rabbitmq:5672}
    ports:
      - "8080:8080"
    depends_on:
      - postgresql
      - rabbitmq

  # Database Service (postgresql)
  postgresql:
    image: postgres:16-alpine
    container_name: transactional-system-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transactional-system_db}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  
  # Message Broker
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: transactional-system-mq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-dev_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-dev_password}
    ports:
      - "5672:5672"
      - "15672:15672"
  

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: transactional-system-redis
    ports:
      - "6379:6379"

volumes:
  db_data:
